<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo_se.png" />
    <title>Blockly Workspace</title>
    <style>
      :root {
        --bg-color: #f4f6f8;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --primary: #3b82f6;
        --radius: 12px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 24px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        margin-bottom: 20px;
      }

      h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.025em;
      }

      .app-container {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 20px;
        flex: 1;
        min-height: 0; /* Prevents grid blowout */
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .card-header {
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #f8fafc;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-muted);
      }

      /* Blockly Workspace Container */
      .code-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
      }

      .code-actions button {
        padding: 7px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: var(--card-bg);
        color: var(--text-main);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .code-actions button:hover { background: #eff6ff; }
      .code-actions button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

      #actionStatus {
        padding: 0 16px;
        color: var(--text-muted);
        font-size: 13px;
      }

      #actionStatus:not(:empty) { padding: 8px 16px; }

      #blocklyDiv {
        flex: 1;
        width: 100%;
        height: 100%;
      }

      /* Right Sidebar Layout */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
      }

      .output-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      #codeOutput, #errorOutput {
        flex: 1;
        padding: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        overflow-y: auto;
        margin: 0;
      }

      #codeOutput {
        background: #0f172a;
        color: #38bdf8;
      }

      #errorOutput {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f8fafc;
        color: var(--text-main);
        border-top: 1px solid var(--border-color);
      }

      .validation-status {
        color: #64748b;
        font-weight: 500;
      }

      .validation-error {
        padding: 12px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
      }

      .validation-error-title {
        margin-bottom: 4px;
        color: #b91c1c;
        font-weight: 700;
      }

      .validation-error-message {
        color: #7f1d1d;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .validation-error-location {
        margin-top: 6px;
        color: #991b1b;
        font-size: 12px;
      }

      /* Responsive layout for smaller screens */
      @media (max-width: 1024px) {
        .app-container {
          grid-template-columns: 1fr;
          height: auto;
        }
        body {
          height: auto;
        }
        #blocklyDiv {
          height: 500px;
        }
        .sidebar {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Blockly Visual Language Environment</h2>
    </header>

    <div class="app-container">
      <!-- Left Column: Blockly Workspace -->
      <div class="card">
        <div id="blocklyDiv"></div>
      </div>

      <!-- Right Column: Code & Errors stacked -->
      <div class="sidebar">
        <div class="card output-pane">
          <div class="card-header">Generated Code</div>
          <div class="code-actions" role="group" aria-label="Workspace and YAML actions">
            <button id="loadExample" type="button">Load Example</button>
            <button id="clearWorkspace" type="button">Clear</button>
            <button id="copyYaml" type="button">Copy YAML</button>
            <button id="downloadYaml" type="button">Download YAML</button>
          </div>
          <div id="actionStatus" role="status" aria-live="polite"></div>
          <pre id="codeOutput">// Code will appear here...</pre>
        </div>

        <div class="card output-pane" style="flex: 0.8;">
          <div class="card-header">Console Errors</div>
          <div id="errorOutput">No errors detected.</div>
        </div>
      </div>
    </div>
    
    <!-- Load our TypeScript file -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
